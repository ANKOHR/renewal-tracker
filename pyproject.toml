[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renewal-tracker"
version = "1.0.0"
description = "Deterministic local renewal tracking with explicit provenance"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rt = "renewal_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["renewal_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
